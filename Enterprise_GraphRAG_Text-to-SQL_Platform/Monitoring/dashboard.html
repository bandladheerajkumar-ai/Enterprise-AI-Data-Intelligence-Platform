<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>AI Observability Dashboard</title>

    <link rel="stylesheet" href="dashboard.css">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

    <div class="header">
        <h1>AI Observability Dashboard</h1>
    </div>

    <div class="cards">

        <div class="card">
            <h3>Total Requests</h3>
            <h1 id="totalRequests">0</h1>
        </div>

        <div class="card">
            <h3>Success Rate</h3>
            <h1 id="successRate">0%</h1>
        </div>

        <div class="card">
            <h3>Avg Latency</h3>
            <h1 id="avgLatency">0 sec</h1>
        </div>

        <div class="card">
            <h3>Avg SQL Time</h3>
            <h1 id="avgSqlTime">0 ms</h1>
        </div>

    </div>

    <div class="chart-container">
        <canvas id="latencyChart"></canvas>
    </div>

    <div class="table-container">

        <h2>Recent Requests</h2>

        <table id="requestTable">

            <thead>
                <tr>
                    <th>ID</th>
                    <th>Question</th>
                    <th>Latency (sec)</th>
                    <th>Schema (ms)</th>
                    <th>SQL Gen (ms)</th>
                    <th>SQL Exec (ms)</th>
                    <th>Repair</th>
                    <th>Status</th>
                </tr>
            </thead>

            <tbody></tbody>

        </table>

    </div>

    <script src="dashboard.js"></script>

</body>

</html>
